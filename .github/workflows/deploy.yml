name: Deploy to GitHub Pages
on:
  push:
    branches: [fix-web-blank] # Or your main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Only needed if using EAS

      - name: Install dependencies
        run: npm install

      - name: Build Web
        env:
          EXPO_PUBLIC_BASE_URL: /tafe.labApi
          EXPO_USE_STATIC: false
        run: npx expo export --platform web --clear

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Expo 54 exports to 'dist' by default
          branch: gh-pages
