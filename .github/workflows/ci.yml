# To "deploy to github web
# npm install gh-pages --save-dev --legacy-peer-deps
# npx expo install react-dom@19.1.0 react-native-web@^0.21.0 -- --legacy-peer-deps

name: Test and Deploy Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Linting
        run: |
          if [ -f "./node_modules/.bin/eslint" ]; then
            ./node_modules/.bin/eslint . || true
          else
            echo "ESLint not found, skipping..."
          fi

      - name: Run Unit Tests
        run: npm test --if-present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  deploy-web:
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Only deploy when pushing to the main branch, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Version
        # This creates the 'dist' folder
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BASE_PATH: /tafe.labApi/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
